# ==================================================
# CI(テスト自動実行)
# ==================================================

name: test

# ==================================================
# 実行タイミング
# ・PR作成時
# ・main / development へのpush時
# ==================================================
on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  test:
    # ==================================================
    # 実行環境（GitHub提供のUbuntu）
    # ==================================================
    runs-on: ubuntu-latest
    steps:
      # ==================================================
      # リポジトリのソースコードを取得
      # ==================================================
      - uses: actions/checkout@v4

      # ==================================================
      # Java環境のセットアップ（Spring Boot用）
      # ==================================================
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      # ==================================================
      # Gradleキャッシュ設定
      # ==================================================
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ==================================================
      # テスト実行（Spring Boot + JUnit）
      # ==================================================
      - name: Run tests
        working-directory: apps/api
        run: ./gradlew test
