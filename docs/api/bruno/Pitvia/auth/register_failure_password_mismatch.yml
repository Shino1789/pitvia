info:
  name: ユーザー登録：異常系（パスワード不一致）
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8080/api/v1/auth/register
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "role": "OWNER",
        "userName": "テストユーザー",
        "email": "mismatch@example.com",
        "password": "Password123",
        "confirmPassword": "Password999"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  password と confirmPassword が一致していないリクエストを送信した際、
  カスタムバリデーション（@PasswordMatches）で弾かれ、400 Bad Request (VALIDATION_ERROR) が返ることを確認する。
