info:
  name: ログイン認証：異常系（認証情報不一致）
  type: http
  seq: 7

http:
  method: POST
  url: http://localhost:8080/api/v1/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "owner-test@example.com",
        "password": "WrongPasswordX"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  存在しないパスワードでログイン要求があった際、
  LoginService の BadCredentialsException キャッチによりブロックされ、
  400 Bad Request または 401 Unauthorized (INVALID_CREDENTIALS) が返ることを確認する。
