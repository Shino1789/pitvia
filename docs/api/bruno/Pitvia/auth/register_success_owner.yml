info:
  name: ユーザー登録：正常系（OWNER）
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/auth/register
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "role": "OWNER",
        "userName": "山本大介",
        "email": "owner-test@example.com",
        "password": "Password123",
        "confirmPassword": "Password123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  「OWNER」アカウントの作成
