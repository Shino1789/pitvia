info:
  name: ユーザー登録：異常系（ADMINブロック）
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/v1/auth/register
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "role": "ADMIN",
        "userName": "アドミン山下",
        "email": "admin-attack@example.com",
        "password": "Password789",
        "confirmPassword": "Password789"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  一般公開の登録APIから「ADMIN」ロールでの登録要求があった際、
  サービス層のガード句でブロックされ、400 Bad Request (INVALID_ROLE) が返ることを確認する。
