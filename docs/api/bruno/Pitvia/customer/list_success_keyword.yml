info:
  name: 顧客一覧取得：正常系（keyword検索）
  type: http
  seq: 11

http:
  method: GET
  url: http://localhost:8080/api/v1/customers?keyword=オーナー
  params:
    - name: keyword
      value: オーナー
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  `keyword`パラメータで顧客名（ユーザー名）を部分一致検索する。

  「オーナーテスト」にヒットし、`data.content`に1件返ることを確認する。
  `keyword=存在しない名前`等、ヒットしないキーワードでは`data.content`が空配列に
  なることも合わせて確認すると良い。

  ※このシナリオは開発環境の初期モックデータ（V1000__mock_data.sql）に依存します。
  実行前に、`shop@example.com` / `password123` でログインし、トークンが保持されている
  必要があります。
