info:
  name: 顧客一覧取得：正常系（pagination）
  type: http
  seq: 12

http:
  method: GET
  url: http://localhost:8080/api/v1/customers?page=1&size=1
  params:
    - name: page
      value: "1"
      type: query
    - name: size
      value: "1"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  `page`/`size`によるページングを確認する。

  以下を確認する。
  1. `data.content.length()`が指定した`size`（1）以下であること。
  2. `data.page`が1、`data.size`が1であること。
  3. `data.totalElements`/`data.totalPages`が全件数から見て妥当な値であること。

  ※このシナリオは開発環境の初期モックデータ（V1000__mock_data.sql）に依存します
  （連携中の顧客は1件のみのため、`totalElements`は1になります）。
  実行前に、`shop@example.com` / `password123` でログインし、トークンが保持されている
  必要があります。
