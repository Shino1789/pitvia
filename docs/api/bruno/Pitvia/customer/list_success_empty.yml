info:
  name: 顧客一覧取得：正常系（連携中の顧客なし）
  type: http
  seq: 13

http:
  method: GET
  url: http://localhost:8080/api/v1/customers
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  連携中の顧客が1件も無いSHOPで一覧を取得し、`data.content`が空配列、
  `data.totalElements`が0になることを確認する。

  ※実行前に `auth/register_success_shop.yml` → `auth/login_success_shop.yml`
  （モックデータのショップテストとは別の、Brunoテスト用SHOPアカウント。
  どのオーナーとも連携していない）でログインし、トークンが保持されている必要があります。
