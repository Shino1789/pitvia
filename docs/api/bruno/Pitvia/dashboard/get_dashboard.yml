info:
  name: ダッシュボード初期表示
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/api/v1/dashboard
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【ダッシュボードの初期化API】
  ログイン中のユーザー権限（OWNER等）に応じたダッシュボードの初期表示データを取得する。

  ※実行前に `auth/login_success_owner.yml` でログインし、トークンが保持（またはCookieがセット）されている必要があります。
