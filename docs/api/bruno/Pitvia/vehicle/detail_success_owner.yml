info:
  name: 車両詳細（自分）：正常系（OWNER）
  type: http
  seq: 14

http:
  method: GET
  url: http://localhost:8080/api/v1/vehicles/c0eebc99-9c0b-4ef8-bb6d-6bb9bd380a33
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  ログインユーザー（OWNER）が自身の車両（RX-7 / モックデータ）の詳細を取得する。
  `data.canEdit`がtrueであることを確認する。

  ※実行前に `auth/login_success_owner.yml` でログインし、トークンが保持されている必要があります。
