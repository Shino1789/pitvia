info:
  name: 車両詳細（顧客車両）：正常系（SHOP・閲覧のみ）
  type: http
  seq: 16

http:
  method: GET
  url: http://localhost:8080/api/v1/vehicles/c0eebc99-9c0b-4ef8-bb6d-6bb9bd380a33
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  SHOPが、車両共有関係にある顧客（オーナーテスト）の車両（RX-7）詳細を取得する。
  200で取得できるが、`data.canEdit`がfalseであることを確認する（閲覧のみ、編集不可）。

  ※実行前に、モックデータ用SHOPアカウント（shop@example.com / password123）で
  `POST /auth/login` を実行し、そのアクセストークンを `accessToken` 環境変数へ設定してください。
