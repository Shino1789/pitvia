info:
  name: 車両詳細：異常系（無関係な車両）
  type: http
  seq: 17

http:
  method: GET
  url: http://localhost:8080/api/v1/vehicles/d0eebc99-9c0b-4ef8-bb6d-6bb9bd380a44
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  OWNER（オーナーテスト）が、自身が所有せず、車両共有関係も無い車両
  （SHOPのデモカー GT-R）の詳細を取得しようとするケース。
  404 Not Found（VEHICLE_NOT_FOUND）が返ることを確認する。

  ※実行前に `auth/login_success_owner.yml` でログインし、トークンが保持されている必要があります。
