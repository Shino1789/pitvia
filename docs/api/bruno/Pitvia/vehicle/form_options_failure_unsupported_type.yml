info:
  name: 車両登録フォーム選択肢取得：異常系（未対応の車両種別）
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/v1/vehicles/form-options?vehicleType=MOTORCYCLE
  params:
    - name: vehicleType
      value: MOTORCYCLE
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  現時点で未対応の車両種別（MOTORCYCLE）を指定した際、`VehicleFormOptionsService` のガード節で弾かれ、
  400 Bad Request (UNSUPPORTED_VEHICLE_TYPE) が返ることを確認する。

  ※実行前に `auth/login_success_owner.yml` でログインし、トークンが保持されている必要があります。
