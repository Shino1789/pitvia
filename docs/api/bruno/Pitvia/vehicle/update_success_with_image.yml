info:
  name: 車両更新：正常系（画像差し替え）
  type: http
  seq: 20

http:
  method: PUT
  url: http://localhost:8080/api/v1/vehicles/c0eebc99-9c0b-4ef8-bb6d-6bb9bd380a33
  body:
    type: multipart-form
    data:
      - name: request
        type: text
        value: |-
          {
            "vehicleType": "CAR",
            "modelName": "RX-7",
            "manufacturerId": 4,
            "modelCode": "FD3S",
            "engineCode": "13B-REW",
            "modelYear": 2002,
            "licensePlate": "品川 300 な 77-77",
            "currentMileage": 86000,
            "transmissionType": "MT",
            "driveType": "FR",
            "memo": "Brunoテストで画像を差し替え"
          }
        contentType: application/json
      - name: file
        type: file
        value:
          - vehicle/assets/sample-icon.png
        contentType: image/png
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  OWNERが自身の車両（RX-7）の画像を新しい画像に差し替える。
  `StorageTransactionManager.replaceAndExecute`による「新規アップロード成功後に旧画像を削除」
  という差し替えフローの動作確認を兼ねる（初回実行時はimageKey未設定のため実質新規アップロード
  と同じ挙動になり、2回目以降の実行で実際の差し替え・旧ファイル削除が発生する）。

  ※実行前に `auth/login_success_owner.yml` でログインし、トークンが保持されている必要があります。
  ※ファイルパスがBruno上で解決できない場合は、コレクション内の
  `vehicle/assets/sample-icon.png` を選択し直してください。
