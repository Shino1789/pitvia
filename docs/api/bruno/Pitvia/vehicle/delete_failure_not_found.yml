info:
  name: 車両削除：異常系（車両不存在）
  type: http
  seq: 25

http:
  method: DELETE
  url: http://localhost:8080/api/v1/vehicles/00000000-0000-0000-0000-000000000000
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  存在しない車両IDを指定して削除しようとした場合、404 Not Found（VEHICLE_NOT_FOUND）が
  返ることを確認する。

  ※実行前に `auth/login_success_owner.yml` でログインし、トークンが保持されている必要があります。
