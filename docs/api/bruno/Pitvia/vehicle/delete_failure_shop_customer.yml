info:
  name: 車両削除：異常系（SHOPが顧客車両を削除）
  type: http
  seq: 24

http:
  method: DELETE
  url: http://localhost:8080/api/v1/vehicles/c0eebc99-9c0b-4ef8-bb6d-6bb9bd380a33
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  SHOPが、車両共有関係にある顧客（オーナーテスト）の車両（RX-7）を削除しようとするケース。
  閲覧はできるが所有者ではないため、403 Forbidden（VEHICLE_EDIT_NOT_ALLOWED）が返ることを確認する
  （RX-7自体は削除されないため、安全に繰り返し実行できる）。

  ※実行前に、モックデータ用SHOPアカウント（shop@example.com / password123）で
  `POST /auth/login` を実行し、そのアクセストークンを `accessToken` 環境変数へ設定してください。
