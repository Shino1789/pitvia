info:
  name: 整備履歴一覧：異常系（車両不存在）
  type: http
  seq: 12

http:
  method: GET
  url: http://localhost:8080/api/v1/maintenance-records?vehicleId=00000000-0000-0000-0000-000000000000
  params:
    - name: vehicleId
      value: 00000000-0000-0000-0000-000000000000
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  存在しない車両IDを指定した場合、`list_failure_no_relation`（無関係な車両）と
  全く同じ404（`VEHICLE_NOT_FOUND`）が返ることを確認する。ステータス・エラーコードが
  同一であることにより、対象車両の存在有無を外部から推測できないことを検証する。

  ※実行前に `auth/login_success_owner.yml` でログインし、トークンが保持されている必要があります。
