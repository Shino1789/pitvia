info:
  name: 整備履歴一覧（自分）：正常系（SHOP）
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/v1/maintenance-records
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  ログインユーザー（SHOP）が自身の車両（デモカー GT-R）の整備履歴一覧を取得する。
  モックデータ上、GT-Rには整備履歴が登録されていないため、200 OKで
  `data.records.content`が空配列（`data.records.totalElements`が0）になることを確認する。

  ※実行前に、モックデータ用SHOPアカウント（shop@example.com / password123）で
  `POST /auth/login` を実行し、そのアクセストークンを `accessToken` 環境変数へ設定してください。
