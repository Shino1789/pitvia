info:
  name: 整備履歴登録：異常系（車両不存在・未連携）
  type: http
  seq: 18

http:
  method: POST
  url: http://localhost:8080/api/v1/maintenance-records
  body:
    type: multipart-form
    data:
      - name: request
        type: text
        contentType: application/json
        value: |-
          {
            "vehicleId": "d0eebc99-9c0b-4ef8-bb6d-6bb9bd380a44",
            "title": "車検対応",
            "maintenanceType": "VEHICLE_INSPECTION",
            "workDateFrom": "2026-04-10",
            "workDateTo": null,
            "mileage": 45500,
            "remarks": null,
            "workItems": [
              {
                "maintenanceCategory": "ENGINE",
                "workContent": "エンジンオイル交換",
                "performedBy": "オーナー本人（DIY）",
                "laborCost": 0,
                "parts": []
              }
            ]
          }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  OWNER（オーナーテスト）が、自身の所有でも連携済みでもない車両（ショップのデモカー GT-R、
  vehicleId=d0eebc99-9c0b-4ef8-bb6d-6bb9bd380a44）に整備履歴を登録しようとした場合、
  404（`VEHICLE_NOT_FOUND`）が返ることを確認する。車両が存在しない場合と権限が無い場合を
  区別せず、対象車両の存在有無を外部から推測できないことを検証する。

  ※実行前に `auth/login_success_owner.yml` でログインし、トークンが保持されている必要があります。
