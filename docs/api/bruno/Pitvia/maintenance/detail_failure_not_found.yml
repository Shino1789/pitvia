  type: http
  seq: 22

http:
  method: GET
  url: http://localhost:8080/api/v1/maintenance-records/00000000-0000-0000-0000-000000000000
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  存在しない整備記録IDを指定した場合、404 Not Found（`MAINTENANCE_RECORD_NOT_FOUND`）が返ることを確認する。

  ※実行前に `auth/login_success_owner.yml` でログインし、トークンが保持されている必要があります。
