info:
  name: 整備履歴削除（顧客の登録・SHOP削除）：異常系（編集権限なし）
  type: http
  seq: 27

http:
  method: DELETE
  url: http://localhost:8080/api/v1/maintenance-records/{{maintenanceRecordId}}
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  SHOPが、APPROVED状態で連携している顧客車両（RX-7）の整備履歴（OWNER自身が登録したもの）を
  削除しようとした場合、403 Forbidden（`MAINTENANCE_RECORD_EDIT_NOT_ALLOWED`）が返ることを確認する。

  ※実行前に、OWNERで `auth/login_success_owner.yml` → `list_success_owner.yml` を実行して
  `maintenanceRecordId` を保存したうえで、`auth/login_success_shop.yml` でSHOPへログインし直してください。
