info:
  name: 整備履歴一覧（顧客車両・vehicleId指定）：正常系（SHOP）
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/api/v1/maintenance-records?vehicleId=c0eebc99-9c0b-4ef8-bb6d-6bb9bd380a33
  params:
    - name: vehicleId
      value: c0eebc99-9c0b-4ef8-bb6d-6bb9bd380a33
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  SHOPが、車両共有関係にある顧客（オーナーテスト）の車両（RX-7）を`vehicleId`で指定し、
  その車両の整備履歴一覧を取得する。`data.owner`にオーナー情報（id/userName）が
  設定されることを確認する（URLに`ownerId`を含めずとも、Backend側で`vehicleId`から
  所有者情報を解決する設計）。

  ※実行前に、モックデータ用SHOPアカウント（shop@example.com / password123）で
  `POST /auth/login` を実行し、そのアクセストークンを `accessToken` 環境変数へ設定してください。
