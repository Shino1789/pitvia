info:
  name: 整備履歴削除（登録者本人）：正常系（OWNER）
  type: http
  seq: 28

http:
  method: DELETE
  url: http://localhost:8080/api/v1/maintenance-records/{{maintenanceRecordId}}
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  登録者本人（OWNER）が、自身の整備履歴を削除する。204 No Contentが返ることを確認する。

  ⚠️ 注意：このリクエストはモックデータの整備履歴を実際に論理削除します。
  実行後は `maintenanceRecordId` が指す記録が失われるため、同フォルダの他の `detail_*` /
  `update_*` シナリオを再実行するには、`list_success_owner.yml` から再取得するか、DBを
  再作成してモックデータを再投入してください（`./scripts/reset.sh` 等）。
  そのため、本シナリオは他の整備履歴シナリオをすべて確認し終えた最後に実行することを推奨します。

  ※実行前に `auth/login_success_owner.yml` → `list_success_owner.yml` の順で実行し、
  `maintenanceRecordId` を保存しておく必要があります。
