info:
  name: 整備履歴一覧（顧客車両・ownerId指定）：正常系（SHOP）
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8080/api/v1/maintenance-records?ownerId=a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
  params:
    - name: ownerId
      value: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  SHOPが、車両共有関係にある顧客（オーナーテスト）を`ownerId`で指定し、
  その顧客の共有車両群（RX-7）の整備履歴一覧を取得する。`data.owner`にオーナー情報が
  設定されることを確認する。

  ※実行前に、モックデータ用SHOPアカウント（shop@example.com / password123）で
  `POST /auth/login` を実行し、そのアクセストークンを `accessToken` 環境変数へ設定してください。
