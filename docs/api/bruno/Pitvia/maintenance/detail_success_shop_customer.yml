info:
  name: 整備履歴詳細（顧客の登録・SHOP閲覧）：正常系（閲覧のみ）
  type: http
  seq: 21

http:
  method: GET
  url: http://localhost:8080/api/v1/maintenance-records/{{maintenanceRecordId}}
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  SHOPが、APPROVED状態で連携している顧客車両（RX-7）の整備履歴（OWNER自身が登録したもの）を閲覧する。
  車両の連携によって閲覧はできるが、登録者本人ではないため`data.canEdit`はfalseになることを確認する
  （「車両所有者/連携先だから編集可能」ではないことの確認）。

  ※実行前に、OWNERで `auth/login_success_owner.yml` → `list_success_owner.yml` を実行して
  `maintenanceRecordId` を保存したうえで、`auth/login_success_shop.yml` でSHOPへログインし直してください。
