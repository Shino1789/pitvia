info:
  name: 整備履歴一覧（キーワード検索）：正常系
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:8080/api/v1/maintenance-records?keyword=オイル
  params:
    - name: keyword
      value: オイル
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  整備タイトルに「オイル」を含む整備履歴のみに絞り込まれることを確認する
  （部分一致・大文字小文字を区別しない）。

  ※実行前に `auth/login_success_owner.yml` でログインし、トークンが保持されている必要があります。
