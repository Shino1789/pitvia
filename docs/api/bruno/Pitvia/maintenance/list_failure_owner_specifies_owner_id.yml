info:
  name: 整備履歴一覧：異常系（OWNERがownerId指定）
  type: http
  seq: 10

http:
  method: GET
  url: http://localhost:8080/api/v1/maintenance-records?ownerId=00000000-0000-0000-0000-000000000000
  params:
    - name: ownerId
      value: 00000000-0000-0000-0000-000000000000
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  `ownerId`はSHOP専用パラメータのため、OWNERが指定した場合は400 Bad Request
  （`OWNER_ID_NOT_ALLOWED`）が返ることを確認する。

  ※実行前に `auth/login_success_owner.yml` でログインし、トークンが保持されている必要があります。
