info:
  name: 連携済みショップ一覧取得：正常系（keyword検索）
  type: http
  seq: 21

http:
  method: GET
  url: http://localhost:8080/api/v1/shops?keyword=ショップ
  params:
    - name: keyword
      value: "ショップ"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  ショップ名（ユーザー名）の部分一致で絞り込めることを確認する。

  以下を確認する。
  1. ステータスコードが 200 OK であること。
  2. `data.content.length()`が1であること（"ショップテスト"のみ部分一致）。

  ※このシナリオは開発環境の初期モックデータ（V1000__mock_data.sql）に依存します。
  実行前に、`owner@example.com` / `password123` でログインし、トークンが保持されている
  必要があります。
