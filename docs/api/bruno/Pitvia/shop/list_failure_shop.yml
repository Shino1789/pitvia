info:
  name: 連携済みショップ一覧取得：異常系（SHOPロール）
  type: http
  seq: 23

http:
  method: GET
  url: http://localhost:8080/api/v1/shops
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  ショップ一覧取得APIはOWNERロール専用のため、SHOPロールでアクセスすると
  403 Forbidden（`FORBIDDEN`）が返ることを確認する。

  ※実行前に、SHOPアカウント（`auth/login_success_shop.yml`等）でログインし、
  トークンが保持されている必要があります。
