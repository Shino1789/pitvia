info:
  name: 連携済みショップ一覧取得：正常系（pagination）
  type: http
  seq: 22

http:
  method: GET
  url: http://localhost:8080/api/v1/shops?page=1&size=2
  params:
    - name: page
      value: "1"
      type: query
    - name: size
      value: "2"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  `page`/`size`によるページングを確認する。

  以下を確認する。
  1. ステータスコードが 200 OK であること。
  2. `data.content.length()`が指定した`size`（2）以下であること。
  3. `data.page`が1、`data.size`が2であること。
  4. `data.totalElements`が3以上であること。

  【事前準備（モックデータの1件に加えて、2件のショップと追加連携する）】
  1. `owner@example.com` / `password123` の車両ID
     （`c0eebc99-9c0b-4ef8-bb6d-6bb9bd380a33`、V1000__mock_data.sqlのオーナー車両）を使用する。
  2. 新規SHOPアカウントを2つ登録・ログインし（`auth/register_success_shop.yml`相当）、
     それぞれ`POST /shops/invite-code`で招待コードを発行する
     （`shop/invite_code_issue_success.yml`実行のたびに`inviteCode`環境変数が上書きされるため、
     発行のたびに控えておくこと）。
  3. `owner@example.com`でログインし直し、上記2つの招待コードそれぞれについて
     `POST /shops/link`（`vehicleId`は上記固定UUID）を実行し、連携を2件追加する。
  4. 再度`owner@example.com`でログインし、このリクエストを実行する
     （モックの1件 + 追加2件 = 合計3件になっている）。
