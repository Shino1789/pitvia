info:
  name: ショップ連携：異常系（既に連携済み）
  type: http
  seq: 32

http:
  method: POST
  url: http://localhost:8080/api/v1/shops/link
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "vehicleId": "c0eebc99-9c0b-4ef8-bb6d-6bb9bd380a33",
        "inviteCode": "{{inviteCode}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  既にAPPROVED状態で連携済みの車両×ショップの組み合わせへ再度連携しようとすると、
  409 Conflict（`SHOP_ALREADY_LINKED`）が返ることを確認する。

  以下を確認する。
  1. ステータスコードが 409 Conflict であること。
  2. `error.code`が`"SHOP_ALREADY_LINKED"`であること。

  ※`owner@example.com`の車両（`c0eebc99-9c0b-4ef8-bb6d-6bb9bd380a33`）は、
  モックデータ（V1000__mock_data.sql）上で`shop@example.com`のショップと
  既にAPPROVED連携済みである。

  【実行前提】
  1. `shop@example.com` / `password123`（モックデータ用SHOPアカウント）でログインし、
     `shop/invite_code_issue_success.yml`を実行して招待コードを発行する
     （`inviteCode`環境変数へ自動保存される。既存の連携状態には影響しない）。
  2. `owner@example.com` / `password123` でログインし直し、トークンを`accessToken`へ
     設定したうえで本リクエストを実行する。
