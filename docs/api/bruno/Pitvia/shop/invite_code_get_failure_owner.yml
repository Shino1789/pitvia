info:
  name: 招待コード取得：異常系（OWNER）
  type: http
  seq: 13

http:
  method: GET
  url: http://localhost:8080/api/v1/shops/invite-code
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【異常系テスト】
  招待コード取得APIはSHOPロール専用のため、OWNERロールでアクセスすると
  403 Forbidden（`FORBIDDEN`）が返ることを確認する。

  ※実行前に、OWNERアカウント（`auth/login_success_owner.yml`等）でログインし、
  トークンが保持されている必要があります。
