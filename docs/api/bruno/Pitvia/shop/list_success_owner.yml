info:
  name: 連携済みショップ一覧取得：正常系（OWNER）
  type: http
  seq: 20

http:
  method: GET
  url: http://localhost:8080/api/v1/shops
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  【正常系テスト】
  OWNERが、APPROVED状態で連携中のショップ一覧を取得する。

  以下を確認する。
  1. ステータスコードが 200 OK であること。
  2. `data.content`に連携中のショップ（ショップテスト）が1件含まれること。
  3. `data.content[0].shopName`が`"ショップテスト"`であること。
  4. `data.content[0].linkedVehicles`に連携車両（RX-7）が含まれること。
  5. `data.totalElements`が1であること。

  ※このシナリオは開発環境の初期モックデータ（V1000__mock_data.sql）に依存します。
  実行前に、`owner@example.com` / `password123`（モックデータ用OWNERアカウント）で
  `POST /auth/login` を実行し、そのアクセストークンを `accessToken` 環境変数へ設定してください。
