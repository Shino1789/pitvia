# ==========================================================
# User Validation
# ==========================================================
# --- Email ---
validation.user.email.required=メールアドレスは必須です
validation.user.email.invalid=メールアドレスの形式が正しくありません
validation.user.email.size.max=メールアドレスは{max}文字以内で入力してください
# --- Password ---
validation.user.password.required=パスワードは必須です
validation.user.password.size.range=パスワードは{min}文字以上{max}文字以内で入力してください
validation.user.password.pattern=パスワードは英字と数字を少なくとも1文字ずつ含める必要があります
# --- User Name ---
validation.user.userName.required=ユーザー名は必須です
validation.user.userName.size.max=ユーザー名は{max}文字以内で入力してください
# --- Role ---
validation.user.role.required=ユーザーロールは必須です
# --- Confirm Password ---
validation.user.confirmPassword.required=確認用パスワードは必須です
validation.user.confirmPassword.mismatch=パスワードが一致しません

# ==========================================================
# Auth Validation
# ==========================================================
# --- Refresh Token ---
validation.auth.refreshToken.required=リフレッシュトークンは必須です
validation.auth.refreshToken.size.max=リフレッシュトークンは{max}文字以内で入力してください

# ==========================================================
# JSON Parse Error
# ==========================================================
validation.json.invalid.format=選択された値は無効です

# ==========================================================
# Period Validation
# ==========================================================
validation.period.invalid=指定された集計単位に対応する日付フォーマット（月次: yyyy-MM, 年次: yyyy）で入力してください
