# ==========================================================
# User Validation
# ==========================================================
# --- Email ---
validation.user.email.required=メールアドレスは必須です
validation.user.email.invalid=メールアドレスの形式が正しくありません
validation.user.email.size.max=メールアドレスは{max}文字以内で入力してください
# --- Password ---
validation.user.password.required=パスワードは必須です
validation.user.password.size.range=パスワードは{min}文字以上{max}文字以内で入力してください
validation.user.password.pattern=パスワードは英字と数字を少なくとも1文字ずつ含める必要があります
# --- User Name ---
validation.user.userName.required=ユーザー名は必須です
validation.user.userName.size.max=ユーザー名は{max}文字以内で入力してください
# --- Role ---
validation.user.role.required=ユーザーロールは必須です
# --- Confirm Password ---
validation.user.confirmPassword.required=確認用パスワードは必須です
validation.user.confirmPassword.mismatch=パスワードが一致しません

# ==========================================================
# Auth Validation
# ==========================================================
# --- Refresh Token ---
validation.auth.refreshToken.required=リフレッシュトークンは必須です
validation.auth.refreshToken.size.max=リフレッシュトークンは{max}文字以内で入力してください

# ==========================================================
# JSON Parse Error
# ==========================================================
validation.json.invalid.format=選択された値は無効です

# ==========================================================
# Period Validation
# ==========================================================
validation.period.invalid=指定された集計単位に対応する日付フォーマット（月次: yyyy-MM, 年次: yyyy）で入力してください

# ==========================================================
# Vehicle Validation
# ==========================================================
# --- Vehicle Type ---
validation.vehicle.vehicleType.required=車両種別は必須です
# --- Model Name ---
validation.vehicle.modelName.required=車種名は必須です
validation.vehicle.modelName.size.max=車種名は{max}文字以内で入力してください
# --- Manufacturer ---
validation.vehicle.manufacturerId.required=メーカーは必須です
# --- Model Code ---
validation.vehicle.modelCode.size.max=型式は{max}文字以内で入力してください
# --- Engine Code ---
validation.vehicle.engineCode.size.max=エンジン型式は{max}文字以内で入力してください
# --- Model Year ---
validation.vehicle.modelYear.required=年式は必須です
validation.vehicle.modelYear.min=年式は{value}年以降を入力してください
validation.vehicle.modelYear.future=年式は現在の年から{maxYearsAhead}年先までしか入力できません
# --- License Plate ---
validation.vehicle.licensePlate.size.max=ナンバープレートは{max}文字以内で入力してください
# --- Current Mileage ---
validation.vehicle.currentMileage.required=走行距離は必須です
validation.vehicle.currentMileage.min=走行距離は{value}以上で入力してください
# --- Transmission Type ---
validation.vehicle.transmissionType.required=トランスミッション形式は必須です
# --- Drive Type ---
validation.vehicle.driveType.required=駆動方式は必須です
