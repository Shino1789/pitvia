# ==================================================
# Spring Boot 共通設定
# ==================================================
spring:
  # アプリケーション設定
  application:
    name: api

  # データベース接続設定
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVER_PORT:8080}
