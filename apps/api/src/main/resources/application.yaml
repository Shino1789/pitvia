# ==================================================
# Spring Boot 共通設定
# ==================================================
spring:
  # アプリケーション設定
  application:
    name: api

  # データベース接続設定
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Flyway設定
  flyway:
    # 実スキーマのパス
    locations: classpath:db/migration

  # JPA設定
  jpa:
    open-in-view: false

  # ファイルアップロード設定
  servlet:
    multipart:
      # アップロード可能な1ファイルあたりの最大サイズ
      max-file-size: 15MB
      # 1回のリクエスト全体でアップロード可能な最大サイズ
      max-request-size: 120MB

  web:
    resources:
      # 静的リソースの自動マッピングを無効化
      add-mappings: false

  # メッセージソース設定
  messages:
    encoding: UTF-8
    basename:
      - messages
      - ValidationMessages

  jackson:
    # デフォルトタイムゾーン
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  # CORS設定
  cors:
    allowed-origins:
      - ${FRONTEND_URL}

  # Security設定
  security:
    swagger-enabled: false
    cookie:
      secure: true
      same-site: None
      # Frontend/BackendがサブドメインでURLが分かれる本番環境で、Cookieを両ホスト間で共有するためのDomain属性
      # （例: .pitviaapp.com）。未設定時はhost-only Cookieとして発行される
      domain: ${COOKIE_DOMAIN:}

  # スケジューラ設定
  scheduler:
    refresh-token-cron: "0 0 3 * * *"
    storage-orphan-cleanup-cron: "0 30 3 * * *"

  # ストレージ設定（MinIO / AWS S3）
  storage:
    # 利用するプロバイダー（minio または s3）
    provider: ${STORAGE_PROVIDER:minio}
    # 画像公開URLのベース（例: http://localhost:9000/pitvia や https://cdn.pitvia.com）
    public-base-url: ${STORAGE_PUBLIC_BASE_URL}
    # 保存先のバケット名
    bucket: ${STORAGE_BUCKET}
    # リージョン名
    region: ${STORAGE_REGION:us-east-1}
    # 孤児ファイルクリーンアップ設定
    orphan-cleanup:
      # クリーンアップ処理の有効可否
      enabled: true
      # アップロード直後でDB未反映の可能性があるオブジェクトを除外するための猶予期間
      grace-period: 24h
      # trueの場合は削除対象の検出とログ出力のみ行い、実際の削除は行わない
      dry-run: false

jwt:
  # 署名に使用する秘密鍵
  secret-key: ${JWT_SECRET_KEY}
  # アクセストークンの有効期限（デフォルトは15分）
  expiration: ${JWT_EXPIRES:15m}
  # リフレッシュトークンの有効期限（デフォルトは7日間）
  refresh-expiration: ${JWT_REFRESH_EXPIRES:7d}
