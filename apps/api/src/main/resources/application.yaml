# ==================================================
# Spring Boot 共通設定
# ==================================================
spring:
  # アプリケーション設定
  application:
    name: api

  # データベース接続設定
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA設定
  jpa:
    open-in-view: false

  web:
    resources:
      # 静的リソースの自動マッピングを無効化
      add-mappings: false

  # メッセージソース設定
  messages:
    encoding: UTF-8
    basename:
      - messages
      - ValidationMessages

  jackson:
    # デフォルトタイムゾーン
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  # CORS設定
  cors:
    allowed-origins:
      - ${FRONTEND_URL}
  # Security設定
  security:
    swagger-enabled: false

jwt:
  # 署名に使用する秘密鍵
  secret-key: ${JWT_SECRET_KEY}
  # アクセストークンの有効期限（デフォルトは15分）
  expiration: ${JWT_EXPIRES:15m}
  # リフレッシュトークンの有効期限（デフォルトは7日間）
  refresh-expiration: ${JWT_REFRESH_EXPIRES:7d}
