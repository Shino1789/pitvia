# ==================================================
# Spring Boot テスト設定 (Testcontainers + PostgreSQL)
# ==================================================
spring:
  # データベース接続設定
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///pitvia_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  # JPA設定
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

jwt:
  # 署名に使用する秘密鍵
  secret-key: SAMPLEa9h6Y4xvN2B+R5q9P4P1vQ9w5G8iA3qS1Y2VQ=
  # アクセストークンの有効期限
  expiration: 15m
  # リフレッシュトークンの有効期限
  refresh-expiration: 7d
